{{define "chat-new-members"}}
<div class="chat-new-members" data-circle-id="{{.Circle.ID}}" data-circle-name="{{.Circle.Name}}">
    <div class="chat-new-members-header">
        <button type="button"
                class="chat-new-back"
                hx-get="/api/chats/new?step=circles"
                hx-target="#chat-new-step"
                hx-swap="innerHTML"
                aria-label="Back to circles">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M228,128a12,12,0,0,1-12,12H69l51.52,51.51a12,12,0,0,1-17,17l-72-72a12,12,0,0,1,0-17l72-72a12,12,0,0,1,17,17L69,116H216A12,12,0,0,1,228,128Z"></path></svg>
            <span>Back</span>
        </button>
        <div class="chat-new-members-title">
            <span class="chat-new-members-circle">{{.Circle.Name}}</span>
        </div>
    </div>

    {{if .Members}}
    <div class="chat-new-members-search">
        <input type="search"
               class="form-input chat-new-members-filter"
               placeholder="Filter members…"
               autocomplete="off"
               aria-label="Filter members">
    </div>
    <form class="chat-new-members-form"
          hx-post="/api/chats/dm"
          hx-target="#chat-new-error"
          hx-swap="innerHTML">
        <input type="hidden" name="circle_id" value="{{.Circle.ID}}">
        <input type="hidden" name="other_profile_id" value="" data-role="dm-target">
        <ul class="chat-new-members-list" role="list">
            {{range .Members}}
            <li class="chat-new-member-row" data-name="{{.Name}}" data-handle="{{.Handle}}">
                <label class="chat-new-member-label">
                    <input type="checkbox"
                           class="chat-new-member-checkbox"
                           name="participant_profile_ids"
                           value="{{.ID}}"
                           data-profile-id="{{.ID}}"
                           data-display-name="{{.Name}}">
                    <span class="chat-new-member-avatar" aria-hidden="true">
                        {{if .Avatar}}
                        <img src="{{.Avatar}}" alt="">
                        {{else}}
                        <span class="chat-new-member-avatar-placeholder">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256"><path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"></path></svg>
                        </span>
                        {{end}}
                    </span>
                    <span class="chat-new-member-text">
                        <span class="chat-new-member-name">{{.Name}}</span>
                        <span class="chat-new-member-handle">{{.Handle}}</span>
                    </span>
                </label>
            </li>
            {{end}}
        </ul>

        <div class="chat-new-group-name" data-role="group-name" hidden>
            <label class="form-label" for="chat-new-group-name-input">Group name</label>
            <input id="chat-new-group-name-input"
                   class="form-input"
                   type="text"
                   name="name"
                   maxlength="120"
                   placeholder="Auto-generated from members"
                   autocomplete="off">
        </div>

        <div class="form-actions chat-new-members-actions">
            <span class="chat-new-selected-count" data-role="selected-count" aria-live="polite">0 selected</span>
            <button type="submit" class="btn-primary" data-role="submit" disabled>Start conversation</button>
        </div>
    </form>
    {{else}}
    <div class="chat-new-empty">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" viewBox="0 0 256 256" style="opacity:0.4;margin-bottom:0.5rem;color:var(--text-tertiary)" aria-hidden="true">
            <path d="M244.8,150.4a8,8,0,0,1-11.2-1.6A51.6,51.6,0,0,0,192,128a8,8,0,0,1-7.37-4.89,8,8,0,0,1,0-6.22A8,8,0,0,1,192,112a24,24,0,1,0-23.24-30,8,8,0,1,1-15.5-4A40,40,0,1,1,219,117.51a67.94,67.94,0,0,1,27.43,21.68A8,8,0,0,1,244.8,150.4ZM190.92,212a8,8,0,1,1-13.84,8,57,57,0,0,0-98.16,0,8,8,0,1,1-13.84-8,72.06,72.06,0,0,1,33.74-29.92,48,48,0,1,1,58.36,0A72.06,72.06,0,0,1,190.92,212ZM128,176a32,32,0,1,0-32-32A32,32,0,0,0,128,176ZM72,120a8,8,0,0,0-8-8A24,24,0,1,1,87.24,82a8,8,0,1,0,15.5-4A40,40,0,1,0,37,117.51,67.94,67.94,0,0,0,9.6,139.19a8,8,0,1,0,12.8,9.61A51.6,51.6,0,0,1,64,128,8,8,0,0,0,72,120Z"></path>
        </svg>
        <p>No other members in this circle yet.</p>
        <p class="chat-new-hint">Invite people to the circle to chat with them here.</p>
    </div>
    {{end}}
</div>

<script>
(function() {
    var container = document.querySelector('#chat-new-step .chat-new-members');
    if (!container) return;

    var form = container.querySelector('.chat-new-members-form');
    if (!form) return;
    var checkboxes = form.querySelectorAll('.chat-new-member-checkbox');
    var dmTarget = form.querySelector('[data-role="dm-target"]');
    var groupNameWrap = form.querySelector('[data-role="group-name"]');
    var groupNameInput = form.querySelector('#chat-new-group-name-input');
    var submitBtn = form.querySelector('[data-role="submit"]');
    var countLabel = form.querySelector('[data-role="selected-count"]');
    var filterInput = container.querySelector('.chat-new-members-filter');
    var memberRows = container.querySelectorAll('.chat-new-member-row');
    var groupNameDirty = false;

    if (groupNameInput) {
        groupNameInput.addEventListener('input', function() {
            groupNameDirty = this.value.trim().length > 0;
        });
    }

    function selectedCheckboxes() {
        return Array.from(checkboxes).filter(function(c) { return c.checked; });
    }

    function defaultGroupName(selected) {
        var names = selected.map(function(c) { return c.getAttribute('data-display-name') || ''; })
            .filter(function(n) { return n.length > 0; });
        if (names.length <= 3) return names.join(', ');
        return names.slice(0, 3).join(', ') + ' +' + (names.length - 3);
    }

    function sync() {
        var selected = selectedCheckboxes();
        var count = selected.length;
        if (countLabel) {
            countLabel.textContent = count === 1 ? '1 selected' : count + ' selected';
        }
        if (submitBtn) {
            submitBtn.disabled = count === 0;
            submitBtn.textContent = count >= 2 ? 'Create group' : 'Start conversation';
        }
        if (count === 1) {
            form.setAttribute('hx-post', '/api/chats/dm');
            if (dmTarget) dmTarget.value = selected[0].value;
            if (groupNameWrap) groupNameWrap.hidden = true;
            if (groupNameInput) groupNameInput.disabled = true;
        } else {
            form.setAttribute('hx-post', '/api/chats/group');
            if (dmTarget) dmTarget.value = '';
            if (groupNameWrap) groupNameWrap.hidden = count < 2;
            if (groupNameInput) {
                groupNameInput.disabled = count < 2;
                if (count >= 2 && !groupNameDirty) {
                    groupNameInput.value = defaultGroupName(selected);
                }
            }
        }
        if (typeof htmx !== 'undefined') {
            htmx.process(form);
        }
    }

    checkboxes.forEach(function(c) {
        c.addEventListener('change', sync);
    });

    if (filterInput) {
        filterInput.addEventListener('input', function() {
            var q = this.value.trim().toLowerCase();
            memberRows.forEach(function(row) {
                var name = (row.getAttribute('data-name') || '').toLowerCase();
                var handle = (row.getAttribute('data-handle') || '').toLowerCase();
                var visible = !q || name.indexOf(q) !== -1 || handle.indexOf(q) !== -1;
                row.style.display = visible ? '' : 'none';
            });
        });
    }

    form.addEventListener('submit', function() {
        var selected = selectedCheckboxes();
        if (selected.length === 1 && dmTarget) {
            dmTarget.value = selected[0].value;
        }
    });

    sync();
})();
</script>
{{end}}
