{{define "post-composer"}}
<div class="composer" data-circle-id="{{.CircleID}}">
    <form class="composer-form" id="post-composer-form"
          hx-post="/api/posts/htmx"
          hx-target=".posts-feed"
          hx-swap="afterbegin"
          hx-indicator="#composer-submit"
          hx-on::after-request="if(event.detail.successful) this.reset()">
        <textarea
            name="body"
            id="post-body"
            class="composer-input"
            placeholder="Share something with the circle..."
            required
        ></textarea>

        <!-- Hidden fields with defaults -->
        <input type="hidden" name="circle_id" value="{{.CircleID}}" />
        <input type="hidden" name="body_format" id="post-format" value="markdown" />
        <input type="hidden" name="visibility" id="post-visibility" value="members_only" />
        <input type="hidden" name="content_warning" id="post-content-warning" value="" />

        <div class="composer-actions">
            <div class="composer-tools">
                <button type="button" class="composer-tool-btn" title="Attach image">📷</button>
                <button type="button" class="composer-tool-btn" title="Attach file">📎</button>
                <button type="button" class="composer-tool-btn" title="Add emoji">😊</button>
            </div>
            <button type="submit" class="btn-primary" id="composer-submit">
                <span class="btn-text">Post</span>
                <span class="btn-loading htmx-indicator" hidden>
                    <svg class="spinner" viewBox="0 0 24 24">
                        <circle class="spinner-track" cx="12" cy="12" r="10"></circle>
                        <circle class="spinner-head" cx="12" cy="12" r="10"></circle>
                    </svg>
                    Posting...
                </span>
            </button>
        </div>
    </form>
</div>

<style>
.composer {
    background: var(--bg-primary);
    border: 1px solid var(--border-light);
    border-radius: var(--container-radius);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
}

.composer-form {
    display: flex;
    flex-direction: column;
}

.composer-input {
    width: 100%;
    padding: 1rem;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
    min-height: 100px;
    margin-bottom: 1rem;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.5;
}

.composer-input:focus {
    outline: none;
    border-color: var(--border-secondary);
}

.composer-input::placeholder {
    color: var(--text-tertiary);
}

.composer-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.composer-tools {
    display: flex;
    gap: 0.5rem;
}

.composer-tool-btn {
    width: 36px;
    height: 36px;
    border: 1px solid var(--border-light);
    background: var(--bg-secondary);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 1.125rem;
    padding: 0;
}

.composer-tool-btn:hover {
    background: var(--hover-bg);
    border-color: var(--border-secondary);
}

.composer .btn-primary {
    padding: 0.625rem 1.5rem;
    border: 1px solid var(--accent-primary);
    border-radius: var(--container-radius);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--accent-primary);
    color: var(--accent-secondary);
}

.composer .btn-primary:hover:not(:disabled) {
    opacity: 0.9;
}

.composer .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.spinner {
    width: 14px;
    height: 14px;
    animation: spin 1s linear infinite;
}

.spinner-track {
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    opacity: 0.2;
}

.spinner-head {
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-dasharray: 60;
    stroke-dashoffset: 45;
}

/* HTMX loading indicator */
.htmx-indicator {
    display: none;
}

.htmx-request .htmx-indicator {
    display: inline-flex;
}

.htmx-request .btn-text {
    display: none;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (max-width: 640px) {
    .composer {
        padding: 1rem;
    }

    .composer-actions {
        flex-direction: column;
        align-items: stretch;
        gap: 0.75rem;
    }

    .composer-tools {
        justify-content: center;
    }

    .composer .btn-primary {
        width: 100%;
        justify-content: center;
    }
}
</style>

})();
</script>
{{end}}
