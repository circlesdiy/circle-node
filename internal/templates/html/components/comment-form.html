{{define "comment-form"}}
<form class="comment-form"
      hx-post="/api/posts/{{.PostID}}/comments"
      hx-target="#comment-list-{{.PostID}}"
      hx-swap="beforeend"
      hx-on::after-request="if(event.detail.successful) {
          this.reset();
          this.querySelector('.char-current').textContent = '0';
          this.querySelector('button[type=submit]').disabled = true;
      }">

    <input type="hidden" name="body_format" value="plaintext" />

    <div class="comment-form-input">
        <textarea name="body"
                  placeholder="Write a comment..."
                  rows="2"
                  maxlength="2000"
                  required
                  hx-on:input="
                      const length = this.value.trim().length;
                      this.closest('form').querySelector('.char-current').textContent = this.value.length;
                      this.closest('form').querySelector('button[type=submit]').disabled = length === 0;
                  "></textarea>
        <div class="comment-form-footer">
            <div class="comment-form-hint">
                <span class="char-count"><span class="char-current">0</span>/2000</span>
            </div>
            <button type="submit" class="btn-primary btn-sm" disabled>Comment</button>
        </div>
    </div>
</form>
{{end}}
