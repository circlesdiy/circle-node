{{define "chat-new-circles"}}
{{if .}}
<div class="chat-new-circles">
    <p class="chat-new-hint">You can only message people you share a circle with.</p>
    <ul class="chat-new-list" role="list">
        {{range .}}
        <li>
            <button type="button"
                    class="chat-new-circle-row"
                    data-circle-id="{{.ID}}"
                    data-circle-name="{{.Name}}"
                    hx-get="/api/chats/new?step=members&circle={{.ID}}"
                    hx-target="#chat-new-step"
                    hx-swap="innerHTML">
                <span class="chat-new-circle-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,16a87.74,87.74,0,0,1,51.06,16.3l-9.12,9.11A40,40,0,0,0,128,96a40,40,0,0,0,0,80,40,40,0,0,0,28.28-11.72l0,0,13.15-13.15A87.69,87.69,0,0,1,216,128,88.1,88.1,0,0,1,128,216,88,88,0,0,1,128,40Z"></path></svg>
                </span>
                <span class="chat-new-circle-name">{{.Name}}</span>
                <span class="chat-new-circle-chevron" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 256 256"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>
                </span>
            </button>
        </li>
        {{end}}
    </ul>
</div>
{{else}}
<div class="chat-new-empty">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" viewBox="0 0 256 256" style="opacity:0.4;margin-bottom:0.5rem;color:var(--text-tertiary)" aria-hidden="true">
        <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Z"></path>
    </svg>
    <p>You aren't in any circles yet.</p>
    <p class="chat-new-hint">Join or create a circle before starting a conversation.</p>
</div>
{{end}}
{{end}}
