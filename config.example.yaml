# Circles.DIY Configuration
# Copy this to config.yaml and update values for your environment

server:
  port: "8080"
  environment: "development" # development, staging, production
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 30s

database:
  host: "localhost"
  port: 5432
  user: "circles"
  password: "circles_dev_password"
  database: "circles_diy"
  ssl_mode: "disable" # disable, require, verify-ca, verify-full
  max_connections: 25
  min_connections: 5
  max_conn_lifetime: 1h
  max_conn_idle_time: 10m
  health_check_period: 1m

redis:
  host: "localhost"
  port: 6379
  password: ""
  database: 0
  max_retries: 3
  pool_size: 10
  min_idle_conns: 5

auth:
  session_duration: 720h # 30 days
  refresh_token_duration: 2160h # 90 days
  webauthn_timeout: 60s
  webauthn_rp_name: "Circles.DIY"
  webauthn_rp_id: "localhost" # Change to your domain
  webauthn_rp_origin: "http://localhost:8080" # Change to your URL

security:
  csrf_secret: "change-this-to-a-random-32-byte-string"
  rate_limit_requests: 100
  rate_limit_window: 1m
  bcrypt_cost: 12

logging:
  level: "info" # debug, info, warn, error
  format: "json" # json, console
  output: "stdout" # stdout, stderr, or file path

templates:
  hot_reload: true # Auto-reload templates in development

static:
  hot_reload: true # Auto-rebuild CSS in development
